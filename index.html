<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock paper scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>ROCK-PAPER-SCISSORS</h1>
    <div class="choices">
<div class="choice" id="rock">
    <img src="./images mpro2/rock.png" alt="rock" class="src">
</div>

</div>

    <img src="./images mpro2/scissors.png" alt="rock" class="src">
</div>
    
</div>

    <div class="score-boars">
        <div class="score">
        <p id="user-score">0</p>
    <p > YOU </p>
    </div>

    </div>
    </div>



    <div class="msgcontainer"> 
        <p id="msg">PLAY YOUR MOVE !</p>
    </div>
    <script src ="mpro2.js"></script>
